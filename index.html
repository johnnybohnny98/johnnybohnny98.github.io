<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>자니스마켓</title>
<meta name="description" content="자니스마켓(Johnny's Market)이 만드는 앱을 소개해요.">
<link rel="icon" type="image/png" href="ddonya/img/icon-64.png">
<style>
@font-face { font-family: "Surround"; src: url(ddonya/fonts/surround.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "DdonyaText"; font-weight: 600; src: url(ddonya/fonts/text-600.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "DdonyaText"; font-weight: 800; src: url(ddonya/fonts/text-800.woff2) format("woff2"); font-display: swap; }
:root { --ink: #1E2329; --sub: #4E5968; --mute: #8B95A1; --line: #E8EDF2; --bg: #FFFFFF; --card: #FFFFFF; --top: #EAF6FD; --skyD: #2F8FCB; --shadow: 0 1px 2px rgba(30,35,41,.04), 0 8px 24px rgba(30,80,120,.08); color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #EEF2F6; --sub: #AAB6C3; --mute: #7D8A98; --line: #243241; --bg: #0E1621; --card: #16222F; --top: #13283A; --skyD: #7CC4EC; --shadow: 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: linear-gradient(180deg, var(--top) 0, var(--bg) 320px); background-color: var(--bg); color: var(--ink); font-family: "DdonyaText", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-weight: 600; line-height: 1.6; word-break: keep-all; min-height: 100vh; }
main { max-width: 640px; margin: 0 auto; padding: 72px 20px 64px; }
h1 { font-family: "Surround", sans-serif; font-weight: 400; font-size: 44px; line-height: 1.2; letter-spacing: -0.02em; }
.en { margin-top: 4px; font-weight: 800; color: var(--skyD); }
.intro { margin-top: 16px; color: var(--sub); font-size: 17px; }
.label { margin-top: 44px; font-weight: 800; font-size: 14px; color: var(--mute); }
.app { margin-top: 12px; display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: inherit; }
.app img { width: 64px; height: 64px; border-radius: 16px; }
.app .t { font-family: "Surround", sans-serif; font-size: 24px; line-height: 1.2; }
.app .d { font-size: 15px; color: var(--sub); }
.app .go { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--top); color: var(--skyD); display: flex; align-items: center; justify-content: center; flex: 0 0 36px; }
.app .go svg { width: 18px; height: 18px; }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--mute); }
footer a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>자니스마켓</h1>
  <p class="en">Johnny's Market</p>
  <p class="intro">자니스마켓이 만드는 앱을 소개해요.</p>

  <p class="label">앱</p>
  <a class="app" href="ddonya/">
    <img src="ddonya/img/icon-192.png" alt="">
    <span><span class="t">떴냐</span><br><span class="d">매진된 기차표, 취소표 나면 알려줘요</span></span>
    <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
  </a>

  <footer>
    문의 <a href="mailto:johnnybohnny98@gmail.com">johnnybohnny98@gmail.com</a><br>
    © 2026 Johnny's Market
  </footer>
</main>
</body>
</html>
