<head>

<link rel="preload" href="fonts/text-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"DonggeunText";src:url(fonts/text-var.woff2) format("woff2");font-weight:500 900;font-display:swap}
:root{--bg:#F7F7F5;--ink:#111;--sub:#6B6B68;--mute:#A3A39E;--line:#E7E7E3;--card:#fff;--soft:#F0F0EC;--green:#1F9D55}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F0F;--ink:#F3F3F1;--sub:#A0A09C;--mute:#66665F;--line:#232322;--card:#171716;--soft:#222220;--green:#5BD18B}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"DonggeunText",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-weight:500;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:56px 20px calc(48px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}

/* 머리: 사진 + 이름 + 한 줄 */
header{display:flex;align-items:center;gap:14px}
.avatar{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--soft);flex:0 0 56px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--sub)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.handle{font-size:14px;color:var(--sub)}
/* ▼ 소개 한 줄 */
.bio{margin-top:22px;font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.bio span{color:var(--mute)}

/* 목록 */
.label{margin:40px 4px 10px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;transition:background .15s}
.row + .row{border-top:1px solid var(--line)}
a.row:hover{background:var(--soft)}
a.row:active{background:var(--soft)}
.icon{width:48px;height:48px;border-radius:12px;flex:0 0 48px;box-shadow:0 0 0 1px var(--line);object-fit:cover}
.icon.blank{display:flex;align-items:center;justify-content:center;background:var(--soft);box-shadow:none;font-size:22px}
.txt{min-width:0;flex:1}
.name{font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.kind{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:0}
.desc{font-size:14px;color:var(--sub);margin-top:1px}
.st{font-size:12.5px;font-weight:700;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:6px}
.st i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.st.wip i{background:none;border:1.5px solid var(--sub)}
.st.off i{background:var(--mute)}
.go{color:var(--mute);flex:0 0 auto}
.go svg{width:18px;height:18px;display:block}
.row.off .icon{filter:grayscale(1);opacity:.6}
.row.off .name,.row.off .desc{color:var(--mute)}

/* 아래: SNS + 연락 */
.links{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;
  background:var(--card);border:1px solid var(--line)}
.links a.mail{grid-column:span 2;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links svg{width:18px;height:18px}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--mute)}
</style>
</head>
